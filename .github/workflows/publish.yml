name: Publish to pub.dev

on:
  push:
    tags:
      # Must align with the tag pattern configured on pub.dev: `v{{version}}`.
      - 'v*.*.*'

permissions: {}

jobs:
  pana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - name: Check pub points
        run: |
          dart pub global activate pana 0.23.19
          package_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$package_dir"
          dart pub global run pana --exit-code-threshold 0 "$package_dir"

  publish:
    needs: pana
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    # Optional hardening:
    # 1) Create environment `pub.dev` in GitHub settings.
    # 2) Require the same environment on pub.dev Automated Publishing page.
    # environment: pub.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Dart (attempt 1)
        id: setup_dart_attempt_1
        continue-on-error: true
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Setup Dart (attempt 2)
        if: steps.setup_dart_attempt_1.outcome == 'failure'
        id: setup_dart_attempt_2
        continue-on-error: true
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Setup Dart (attempt 3)
        if: steps.setup_dart_attempt_1.outcome == 'failure' && steps.setup_dart_attempt_2.outcome == 'failure'
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Validate tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match pubspec version ($VERSION)"
            exit 1
          fi
          echo "Tag and pubspec versions match: $TAG"

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish -f
